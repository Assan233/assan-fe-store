map $http_cookie $music_cookie {
  default "";
  "~*(?:^|;[[:space:]]*)(music-token=[^;]+)" $1;
}

map $http_upgrade $music_connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:9090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The NAS reverse proxy must overwrite this header with the client's IP.
    # The API uses it for authentication rate limits.
    proxy_set_header X-Real-IP $http_x_real_ip;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /music {
    return 302 /music/;
  }

  location = /music/assan-custom.css {
    auth_request /music-access;
    alias /usr/share/nginx/html/music-custom.css;
    add_header Cache-Control "no-store";
  }

  location = /music/assan-login.js {
    auth_request /music-access;
    alias /usr/share/nginx/html/music-login.js;
    add_header Cache-Control "no-store";
  }

  location = /music-access {
    internal;
    proxy_pass http://api:9090/api/v1/music/access;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
  }

  location /music/ {
    auth_request /music-access;
    proxy_pass https://www.assanye.top:66;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name www.assanye.top;
    proxy_set_header Host www.assanye.top:66;
    proxy_set_header Cookie $music_cookie;
    proxy_set_header Accept-Encoding "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $music_connection_upgrade;
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-Proto "";
    proxy_redirect https://www.assanye.top:66/ /;
    proxy_cookie_domain www.assanye.top $host;
    proxy_cookie_path /music/ /music/;
    proxy_read_timeout 3600s;
    proxy_buffering off;
    sub_filter_once on;
    sub_filter '</head>' '<link rel="stylesheet" href="/music/assan-custom.css"><script defer src="/music/assan-login.js"></script></head>';
  }

  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
