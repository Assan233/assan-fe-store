services:
  api:
    build:
      context: ../assan-server-store
      args:
        GOPROXY: "${GO_MODULE_PROXY:-https://proxy.golang.org,direct}"
    restart: unless-stopped
    environment:
      HTTP_PORT: "9090"
      LOG_LEVEL: "INFO"
      DATABASE_PATH: /data/assan.db
      SECURE_COOKIES: "${SECURE_COOKIES:-true}"
      TRUST_PROXY: "true"
      MUSIC_CREDENTIAL_KEY: "${MUSIC_CREDENTIAL_KEY:-}"
      VIDEO_PROVIDER: "${VIDEO_PROVIDER:-yt-dlp}"
      VIDEO_TEMP_DIR: /video-cache
      # NAS 媒体工具至少需要启用一条下方的 NAS 挂载。
      NAS_MEDIA_DIR: /nas-media
    ports:
      - "127.0.0.1:${API_HOST_PORT:-29090}:9090"
    volumes:
      - assan-data:/data
      - video-cache:/video-cache
      # NAS 路径可独立挂载。source 必须是宿主机上已有的目录；
      # 每条映射使用不同的 /nas-media/<目录名>，目录名会显示在文件选择器中。
      # - /path/to/nas/videos:/nas-media/videos:ro
      # - /path/to/nas/music:/nas-media/music:rw
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web:
    build: .
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-28080}:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=8m
      - /var/run:size=1m
      - /tmp:size=8m
    cap_drop:
      - ALL
    # Nginx master initializes its tmpfs directories and switches workers to nginx (UID 101).
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  assan-data:
  video-cache:
