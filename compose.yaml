services:
  api:
    build:
      context: ../assan-server-store
    restart: unless-stopped
    environment:
      HTTP_PORT: "8080"
      LOG_LEVEL: "INFO"
      DATABASE_PATH: /data/assan.db
      SECURE_COOKIES: "${SECURE_COOKIES:-true}"
      TRUST_PROXY: "true"
    volumes:
      - assan-data:/data
    stop_grace_period: 15s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  web:
    build: .
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=8m
      - /var/run:size=1m
      - /tmp:size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  assan-data:
